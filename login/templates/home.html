<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Job Portal</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:
                linear-gradient(135deg, rgba(20,30,48,0.82), rgba(36,59,85,0.72)),
                url('https://images.unsplash.com/photo-1497366811353-6870744d04b2?auto=format&fit=crop&w=1800&q=80');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .login-container{
            width:400px;
            background:white;
            padding:40px;
            border-radius:15px;
            box-shadow:0 0 20px rgba(0,0,0,0.3);
            text-align:center;
        }

        .login-container h1{
            margin-bottom:25px;
            color:#243b55;
        }

        .input-box{
            margin-bottom:20px;
            text-align:left;
        }

        .input-box label{
            display:block;
            margin-bottom:8px;
            font-weight:bold;
            color:#333;
        }

        .input-box input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:16px;
        }

        .btn{
            width:100%;
            padding:12px;
            background:#00d4ff;
            border:none;
            border-radius:8px;
            font-size:18px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        }

        .btn:hover{
            background:#243b55;
            color:white;
        }

        .register-link{
            margin-top:20px;
        }

        .register-link a{
            text-decoration:none;
            color:#243b55;
            font-weight:bold;
        }

    </style>

</head>
<body>

    <div class="login-container">

        <h1>Login</h1>

        <form method="POST">

            {% csrf_token %}

            <div class="input-box">
                <label>Username</label>
                <input type="text" name="username" placeholder="Enter Username">
            </div>

            <div class="input-box">
                <label>Password</label>
                <input type="password" name="password" placeholder="Enter Password">
            </div>

            <button type="submit" class="btn">Login</button>

            <div class="register-link">
                <p>Don't have an account? <a href="#">Register</a></p>
            </div>

        </form>

    </div>

</body>
</html>
