{% extends 'base.html' %}
{% block title %}OTP Verification - HireWave{% endblock %}
{% block content %}<section class="auth-section login-page-bg"><div class="container"><div class="auth-shell"><div class="auth-visual"><h1>Verify OTP</h1><p>Confirm your identity before continuing.</p></div><form class="auth-form needs-validation" method="post" novalidate>{% csrf_token %}<h2>OTP Verification</h2>{% if verified %}<div class="alert alert-success">OTP verified.</div>{% endif %}<div class="otp-grid"><input class="form-control" maxlength="1" required><input class="form-control" maxlength="1" required><input class="form-control" maxlength="1" required><input class="form-control" maxlength="1" required></div><button class="btn btn-primary w-100" type="submit">Verify</button></form></div></div></section>{% endblock %}
