{% extends 'base.html' %}
{% block title %}Change Password - HireWave{% endblock %}
{% block content %}<section class="auth-section login-page-bg"><div class="container"><div class="auth-shell"><div class="auth-visual"><h1>Security settings</h1><p>Keep your account protected with a fresh password.</p></div><form class="auth-form needs-validation" method="post" novalidate>{% csrf_token %}<h2>Change Password</h2>{% for field in form %}<label class="form-label">{{ field.label }}</label><div class="input-icon"><i class="fa-solid fa-lock"></i>{{ field }}<button class="password-toggle" type="button"><i class="fa-solid fa-eye"></i></button></div>{% endfor %}<button class="btn btn-primary w-100" type="submit">Save Password</button></form></div></div></section>{% endblock %}
