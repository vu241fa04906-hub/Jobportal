{% extends 'base.html' %}
{% block title %}Forgot Password - HireWave{% endblock %}
{% block content %}<section class="auth-section login-page-bg"><div class="container"><div class="auth-shell"><div class="auth-visual"><h1>Reset access</h1><p>Enter your email to prepare password reset instructions.</p></div><form class="auth-form needs-validation" method="post" novalidate>{% csrf_token %}<h2>Forgot Password</h2><div class="input-icon"><i class="fa-solid fa-envelope"></i>{{ form.email }}</div><button class="btn btn-primary w-100" type="submit">Send Reset Link</button><p class="auth-switch"><a href="{% url 'login' %}">Back to login</a></p></form></div></div></section>{% endblock %}
